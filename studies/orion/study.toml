# One editable matrix for the managed Orion cases.
# Two study types are defined here:
#   1) AoA campaign cases
#   2) Mesh refinement study cases
#
# Edit common values once, then use ordered override rules for subsets.

[study]
name = "Orion"
slug = "orion"
description = "Study definition for the Orion hypersonic CFD campaign."

[defaults]
author = "Anthony Qiu"
institution = "University of Waterloo"
config_date = "2026-03-14"
restart_sol = false
turbulence_model = "SA"
freestream_turbulence_intensity = "0.05"
freestream_turb2lam_visc_ratio = "10.0"
output_wrt_freq = 150
freestream_temperature = 288.15
reynolds_length = 5
cfl_adapt = false
cfl_number = "0.1"
iter = 999999
linear_solver_iter = 100
linear_solver_error = "1E-6"
mg_post_smooth = "( 0, 0, 0, 0 )"
conv_residual_minval = -5
conv_startiter = 10000
screen_output = "(INNER_ITER, WALL_TIME, RMS_DENSITY, RMS_MOMENTUM-X, RMS_MOMENTUM-Y, RMS_MOMENTUM-Z, RMS_ENERGY, RMS_NU_TILDE, DRAG)"
volume_output = "MACH, PRESSURE, TEMPERATURE, DENSITY, HEAT_FLUX, Y_PLUS"

job_nodes = 2
job_ntasks_per_node = 64
job_cpus_per_task = 1
job_mem = 0
job_time = "12:00:00"
job_account = "rrg-jphickey"

postprocess_job_cpus_per_task = 1
postprocess_job_mem = ""
yplus_job_time = "00:15:00"
mirror_job_time = "00:15:00"
slices_job_time = "00:15:00"
shock_job_time = "01:00:00"

[meshes]
coarse = "coarse.su2"
medium = "medium.su2"
fine = "fine.su2"
very_fine = "very_fine.su2"

[boundary_conditions]
marker_heatflux = "( ORION_SURFACE, 0.0 )"
marker_far = "( FARFIELD )"
marker_sym = "( SYMMETRY )"
marker_monitoring = "( ORION_SURFACE )"
marker_plotting = "( ORION_SURFACE )"

[generation]
exclude_cases = []

[generation.studies.aoa]
mach_profiles = ["m1p5", "m3", "m6", "m9"]
aoas = [0, 15, 24, 32, 40, 50, 60]
mesh_level = "very_fine"
case_name_pattern = "m{mach}_aoa{aoa}"

[generation.studies.refinement]
mach_profiles = ["m1p5", "m3", "m6", "m9"]
aoa = 0
mesh_levels = ["coarse", "medium", "fine", "very_fine"]
case_name_pattern = "m{mach}_{mesh_level}"

[generation.studies.cfl_diagnostic]
mach_profiles = ["m9"]
aoa = 32
mesh_level = "very_fine"
case_name_pattern = "m{mach}_aoa{aoa}_cfl0p01"

[generation.studies.cfl_0p05_diagnostic]
mach_profiles = ["m9"]
aoa = 32
mesh_level = "very_fine"
case_name_pattern = "m{mach}_aoa{aoa}_cfl0p05"

[generation.studies.cfl_0p0075_diagnostic]
mach_profiles = ["m9"]
aoa = 50
mesh_level = "very_fine"
case_name_pattern = "m{mach}_aoa{aoa}_cfl0p0075"

[generation.studies.sst_diagnostic]
mach_profiles = ["m9"]
aoa = 50
mesh_level = "very_fine"
case_name_pattern = "m{mach}_aoa{aoa}_sst"

[aliases]
m1p5_very_fine = "m1p5_aoa0"
m3_very_fine = "m3_aoa0"
m6_very_fine = "m6_aoa0"
m9_very_fine = "m9_aoa0"

[profiles.m1p5]
mach_number = "1.5"
reynolds_number = "1.715571333404706E08"
cfl_adapt = true
cfl_number = "1"
cfl_adapt_param = "(0.5, 1.2, 0.1, 3)"

[profiles.m3]
mach_number = "3"
reynolds_number = "3.431142666809411E08"
cfl_adapt = true
cfl_number = "1"
cfl_adapt_param = "(0.5, 1.2, 0.1, 3)"

[profiles.m6]
mach_number = "6"
reynolds_number = "6.862285333618822E08"
cfl_adapt = true
cfl_number = "0.03"
cfl_adapt_param = "(0.5, 1.1, 0.05, 0.5)"

[profiles.m9]
mach_number = "9"
reynolds_number = "1.029342800042823E09"
cfl_adapt = false
cfl_number = "0.005"
cfl_adapt_param = "(0.5, 1.05, 0.005, 0.05)"
volume_output = "MACH, PRESSURE, TEMPERATURE, DENSITY, HEAT_FLUX, Y_PLUS, RESIDUAL"

# Override rules are applied in order, top to bottom.
# You can override any key already used by the templates.
# Match on any combination of:
#   match_cases      = ["m6_aoa40", "m6_aoa50"]
#   match_study      = ["aoa", "refinement"]
#   match_mach       = ["6", "9"]
#   match_mesh_level = ["coarse", "medium", "fine", "very_fine"]
#   match_aoa        = [40, 50, 60]
#   match_aoa_min    = 40
#   match_aoa_max    = 60
# Exclude permanently bad/unused cases with [generation].exclude_cases.
# Boundary conditions are symmetric by default. Override individual marker keys only if
# the symmetric mesh labels change:
#   marker_sym = "( SYMMETRY )"
#
# Example: restart a subset of cases.
# [[overrides]]
# name = "restart selected Mach 6 high AoA cases"
# match_study = ["aoa"]
# match_mach = ["6"]
# match_aoa = [40, 50, 60]
# restart_sol = true
# cfl_number = "0.02"
#
# Example: one exact case.
# [[overrides]]
# name = "longer walltime for m9_aoa60"
# match_cases = ["m9_aoa60"]
# restart_sol = true
# job_time = "30:00:00"

# RESTART
# [[overrides]]
# name = "m3 refinment restart"
# match_study = ["refinement"]
# match_mach = ["3"]
# match_mesh_level = ["coarse", "medium", "fine", "very_fine"]
# restart_sol = true

[[overrides]]
name = "coarse mesh walltime"
match_mesh_level = ["coarse"]
job_time = "04:00:00"
yplus_job_time = "00:15:00"
mirror_job_time = "00:15:00"
slices_job_time = "00:15:00"
shock_job_time = "00:30:00"

[[overrides]]
name = "medium mesh walltime"
match_mesh_level = ["medium"]
job_time = "05:00:00"
yplus_job_time = "00:15:00"
mirror_job_time = "00:15:00"
slices_job_time = "00:15:00"
shock_job_time = "02:00:00"

[[overrides]]
name = "fine mesh walltime"
match_mesh_level = ["fine"]
job_time = "11:00:00"
yplus_job_time = "00:20:00"
mirror_job_time = "00:15:00"
slices_job_time = "00:15:00"
shock_job_time = "01:30:00"

[[overrides]]
name = "very fine mesh walltime"
match_mesh_level = ["very_fine"]
job_time = "18:00:00"
yplus_job_time = "00:30:00"
mirror_job_time = "00:15:00"
slices_job_time = "00:15:00"
shock_job_time = "05:00:00"

[[overrides]]
name = "m9 solver stability"
match_mach = ["9"]
restart_sol = false
conv_startiter = 20000
job_time = "24:00:00"

[[overrides]]
name = "restart healthy m9 AoA continuations"
match_study = ["aoa"]
match_mach = ["9"]
restart_sol = true
cfl_number = "0.05"

[[overrides]]
name = "m6 coarse fixed CFL continuation"
match_cases = ["m6_coarse"]
restart_sol = true
cfl_adapt = false
cfl_number = "0.03"
job_time = "24:00:00"

[[overrides]]
name = "m9 coarse fixed CFL continuation"
match_cases = ["m9_coarse"]
restart_sol = true
cfl_adapt = false
cfl_number = "0.001"
job_time = "24:00:00"

[[overrides]]
name = "clean m9 medium and fine fixed CFL runs"
match_cases = ["m9_medium", "m9_fine"]
restart_sol = false
cfl_adapt = false
cfl_number = "0.001"
job_time = "24:00:00"

[[overrides]]
name = "restart timed-out fine refinement continuations"
match_cases = ["m1p5_fine", "m3_fine"]
restart_sol = true
job_time = "11:00:00"

[[overrides]]
name = "m9 AoA 32 CFL 0.01 diagnostic"
match_cases = ["m9_aoa32_cfl0p01"]
restart_sol = true
cfl_adapt = false
cfl_number = "0.01"
job_time = "24:00:00"

[[overrides]]
name = "m9 AoA 32 CFL 0.05 diagnostic"
match_cases = ["m9_aoa32_cfl0p05"]
restart_sol = true
cfl_adapt = false
cfl_number = "0.05"
job_time = "24:00:00"

[[overrides]]
name = "m9 AoA 50 CFL 0.0075 diagnostic"
match_cases = ["m9_aoa50_cfl0p0075"]
restart_sol = true
cfl_adapt = false
cfl_number = "0.0075"
job_time = "24:00:00"

[[overrides]]
name = "fresh m9 AoA 50 SST diagnostic"
match_cases = ["m9_aoa50_sst"]
restart_sol = false
turbulence_model = "SST"
sst_options = "V2003m"
cfl_adapt = false
cfl_number = "0.005"
screen_output = "(INNER_ITER, WALL_TIME, RMS_DENSITY, RMS_MOMENTUM-X, RMS_MOMENTUM-Y, RMS_MOMENTUM-Z, RMS_ENERGY, RMS_TKE, RMS_DISSIPATION, DRAG)"
job_time = "24:00:00"

